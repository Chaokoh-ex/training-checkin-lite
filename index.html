<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>เช็คชื่ออบรม</title>
  <link rel="icon" href="img/coconut.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="wrap">
    <header class="top">
      <img src="img/coconut.svg" alt="">
      <div>
        <h1 id="title">กำลังโหลด...</h1>
        <div class="sub" id="date"></div>
      </div>
    </header>

    <div id="error" class="msg err hidden"></div>

    <section id="pick" class="stack hidden">
      <input type="search" id="q" placeholder="ค้นหาชื่อ..." autocomplete="off" aria-label="ค้นหาชื่อ">
      <p class="muted" id="hint">แตะชื่อของคุณเพื่อเช็คชื่อ</p>
      <ul class="names" id="names"></ul>
    </section>

    <section id="done" class="card center done hidden">
      <i data-lucide="circle-check" class="big"></i>
      <h2>เช็คชื่อเรียบร้อย</h2>
      <div id="done-name" class="stat"></div>
      <div id="done-time" class="muted"></div>
    </section>
  </main>

  <div id="confirm" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="confirm-text">
    <div class="card stack">
      <p id="confirm-text" style="font-size:1.15rem;margin:0"></p>
      <div class="row">
        <button class="btn" id="confirm-no" style="flex:1">ยกเลิก</button>
        <button class="btn btn-primary" id="confirm-yes" style="flex:1">ใช่ ฉันเอง</button>
      </div>
    </div>
  </div>

  <script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script>
  <script type="module" src="js/checkin.js"></script>
</body>
</html>
